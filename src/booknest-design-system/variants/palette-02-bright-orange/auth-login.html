<!DOCTYPE html>
<html lang="uk" data-theme="light"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BookNest — Вхід</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script>(function(){var s=localStorage.getItem('theme');var d=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=(s==='light'||s==='dark')?s:(d?'dark':'light');})();</script>
<style>/* ============================================================
   BookNest — Design Tokens
   Затишна «лляна» естетика · теракотовий акцент (#A96E47)
   Світла + темна теми. Консолідовано з палітри (≈22 кольори).
   Шрифти: Playfair Display (заголовки) + Manrope (UI).

   Застосування:
     background: var(--bg);
     color: var(--text);
     border: 1px solid var(--border);
     border-radius: var(--radius);
     box-shadow: var(--shadow-card);
   Фокус:  box-shadow: 0 0 0 3px var(--focus-ring);
   Тема:   <html data-theme="dark">  (JS-перемикач — внизу файлу)
   ============================================================ */

:root {
  color-scheme: light;

  /* — Поверхні — */
  --bg:           #F6F0E7;  /* фон сторінки (глибший linen — щоб картки спливали) */
  --surface:      #FDFCFA;  /* картки, праві панелі, модалки (найсвітліше) */
  --surface-alt:  #F1E9DD;  /* сайдбар, hero, утоплені секції */
  --field:        #F4EDE2;  /* фон інпутів (помітний інсет на картці) */
  --border:       #E0D5C5;  /* тонкі лінії, дільники */

  /* — Текст — */
  --ink:            #3D2719; /* заголовки (еспресо) */
  --text:           #4A4039; /* основний текст */
  --text-secondary: #6F625D; /* вторинний рівень (необов'язковий) */
  --muted:          #736858; /* placeholder, приглушений текст (AA ≥4.5) */

  /* — Бренд (теракота) — */
  --primary:        #ED8041; /* кнопки, активні елементи, лінки, progress */
  --primary-hover:  #D96E2E;
  --on-primary:     #3D2719; /* текст/іконки на --primary */

  /* — Акцент: м'який персик (підсвічення) — */
  --accent-soft:    #EED4BF; /* активний пункт меню, вибраний тогл */
  --accent-soft-fg: #3D2719; /* текст на --accent-soft */
  --accent-border:  #E2C3A3; /* контур вибраного тогла / персикові рамки */
  --tag-bg:         #F4ECE3; /* фон тегів/чипів */
  --tag-fg:         #4A4039; /* текст тегів */

  /* — Акцент: насичений (іконки, бейджі, вибрані статус-чипи) — */
  --icon:           #63412E; /* outline-іконки на світлому */
  --chip-bg:        #63412E; /* заливка нумерованих бейджів і вибраних статус-чипів */
  --chip-fg:        #FDFCFA; /* номер/текст на --chip-bg */

  /* — Статуси (семантика; текст-відтінок підібрано під AA на світлому фоні) — */
  --success:    #2F7048;   --success-bg: #EAF6EA;
  --warning:    #8A5314;   --warning-bg: #FFF3DF;
  --danger:     #BE3022;   --danger-bg:  #FFE9E7;  /* також = колір зірочки обов'язкового поля */
  --info:       #2A6299;   --info-bg:    #EAF4FF;

  /* — Фокус — */
  --focus-ring: rgba(237, 128, 65, .20);

  /* — Тіні (теплі, не сірі) — */
  --shadow-card:  0 1px 2px rgba(58,38,24,.04), 0 8px 24px rgba(58,38,24,.05);
  --shadow-hover: 0 12px 28px rgba(58,38,24,.08);
  --shadow-pop:   0 16px 40px rgba(58,38,24,.14);  /* дропдауни / поповери */
  --shadow-page:  0 20px 60px rgba(58,38,24,.10);  /* підйом великої картки */
  --shadow-btn:   0 2px 8px rgba(237,128,65,.30);  /* primary-кнопка */

  /* — Радіуси (спільні для обох тем) — */
  --radius-lg:   24px;    /* велика картка auth-сторінки */
  --radius-md:   16px;    /* секційні картки */
  --radius:      12px;    /* інпути, селекти, кнопки, дропзона */
  --radius-sm:   10px;    /* сегментний тогл */
  --radius-xs:   8px;     /* чипи, теги, статус-пілюлі */
  --radius-full: 9999px;  /* аватар, кругла нумерована плашка */

  /* — Шрифти (родини) — */
  --font-serif: "Playfair Display", "Lora", Georgia, serif;               /* заголовки */
  --font-sans:  "Manrope", "Inter", system-ui, -apple-system, sans-serif; /* UI / текст */

  /* — Типографіка: розміри (clamp = адаптивний діапазон min→max) — */
  --fs-display: clamp(3.25rem, 5vw, 3.75rem);    /* 52→60px — велике заголовкове ("Додати книгу") */
  --fs-h1:      clamp(2.75rem, 4.2vw, 3.25rem);  /* 44→52px — заголовок сторінки/форми */
  --fs-h2:      clamp(1.75rem, 2.6vw, 2.125rem); /* 28→34px — велика секція */
  --fs-h3:      1.375rem;   /* 22px — підзаголовок */
  --fs-title:   1.25rem;    /* 20px — нумеровані секції ("Основна інформація") */
  --fs-body:    1rem;       /* 16px — основний текст / лід */
  --fs-label:   0.875rem;   /* 14px — лейбли полів */
  --fs-sm:      0.8125rem;  /* 13px — дрібний текст */
  --fs-xs:      0.75rem;    /* 12px — підказки ("0/500") */
  --fs-button:  1rem;       /* 16px — текст кнопок */
  --fs-nav:     0.9375rem;  /* 15px — сайдбар / меню */

  /* — Типографіка: товщини — */
  --fw-regular:  400;
  --fw-medium:   500;   /* сайдбар */
  --fw-semibold: 600;   /* заголовки H2/H3, лейбли, кнопки */
  --fw-bold:     700;   /* display / H1 */

  /* — Типографіка: міжрядкові та трекінг — */
  --lh-display: 1.05;
  --lh-heading: 1.2;
  --lh-snug:    1.3;
  --lh-body:    1.5;
  --tracking-display: -0.01em;
}

/* ============================================================
   DARK — затишний espresso (теплі темно-коричневі, без сірого)
   Активується через <html data-theme="dark">
   ============================================================ */
[data-theme="dark"] {
  color-scheme: dark;

  /* — Поверхні (світлішають із підйомом) — */
  --bg:           #17120E;
  --surface:      #241C15;
  --surface-alt:  #1E1712;
  --field:        #332820;
  --border:       #41342A;

  /* — Текст (теплі вершкові) — */
  --ink:            #F4EADF;
  --text:           #DFD2C5;
  --text-secondary: #B0A092;
  --muted:          #9E9184;

  /* — Бренд (теракота, трохи підняли для читабельності) — */
  --primary:        #EE8B53;
  --primary-hover:  #F29E6C;
  --on-primary:     #2A1A0E;

  /* — Акцент: м'який (у темній — теплий брунатний) — */
  --accent-soft:    #3A2A1E;
  --accent-soft-fg: #EAD9C8;
  --accent-border:  #4E3A29;
  --tag-bg:         #2E231B;
  --tag-fg:         #DFD2C5;

  /* — Акцент: насичений (іконки світлішають, щоб читались на темному) — */
  --icon:           #C9A98C;
  --chip-bg:        #7A5840;
  --chip-fg:        #F4EADF;

  /* — Статуси — */
  --success:    #7FB37F;   --success-bg: #1C2A1C;
  --warning:    #ECA45D;   --warning-bg: #2C2415;
  --danger:     #E36B5C;   --danger-bg:  #2E1A18;
  --info:       #82AED6;   --info-bg:    #19232F;

  /* — Фокус — */
  --focus-ring: rgba(238, 139, 83, .32);

  /* — Тіні (на темному — глибші) — */
  --shadow-card:  0 1px 2px rgba(0,0,0,.30), 0 8px 24px rgba(0,0,0,.36);
  --shadow-hover: 0 12px 28px rgba(0,0,0,.42);
  --shadow-pop:   0 16px 40px rgba(0,0,0,.55);
  --shadow-page:  0 24px 60px rgba(0,0,0,.55);
  --shadow-btn:   0 2px 10px rgba(238,139,83,.40);
}

/* ── Альтернатива: авто-dark за системною темою (без JS) ──────
   Розкоментуй цей блок, якщо НЕ використовуєш data-theme-перемикач.
   Спрацьовує лише поки користувач не обрав тему вручну.

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:#17120E; --surface:#241C15; --surface-alt:#1E1712; --field:#332820; --border:#41342A;
    --ink:#F4EADF; --text:#DFD2C5; --text-secondary:#B0A092; --muted:#9E9184;
    --primary:#EE8B53; --primary-hover:#F29E6C; --on-primary:#2A1A0E;
    --accent-soft:#3A2A1E; --accent-soft-fg:#EAD9C8; --accent-border:#4E3A29;
    --tag-bg:#2E231B; --tag-fg:#DFD2C5; --icon:#C9A98C; --chip-bg:#7A5840; --chip-fg:#F4EADF;
    --success:#7FB37F; --success-bg:#1C2A1C; --warning:#ECA45D; --warning-bg:#2C2415;
    --danger:#E36B5C; --danger-bg:#2E1A18; --info:#82AED6; --info-bg:#19232F;
    --focus-ring:rgba(238,139,83,.32);
    --shadow-card:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.36);
    --shadow-hover:0 12px 28px rgba(0,0,0,.42); --shadow-pop:0 16px 40px rgba(0,0,0,.55);
    --shadow-page:0 24px 60px rgba(0,0,0,.55); --shadow-btn:0 2px 10px rgba(238,139,83,.40);
  }
}
*/

/* ── Перемикач теми (JS) ─────────────────────────────────────
   Ініціалізація — system pref + збережений вибір (встав у <head>, до рендера):
     const saved = localStorage.getItem('theme');
     const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
     document.documentElement.dataset.theme = saved ?? (sysDark ? 'dark' : 'light');

   По кліку на 🌙:
     function toggleTheme() {
       const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
       document.documentElement.dataset.theme = next;
       localStorage.setItem('theme', next);
     }
   ──────────────────────────────────────────────────────────── */
</style><style>/* ============================================================
   BookNest — Typography
   Парність: Playfair Display (serif, заголовки) + Manrope (sans, UI/текст)
   Залежить від tokens.css (--font-*, --fs-*, --fw-*, --lh-*, --ink, --text, --muted).

   Підключення шрифтів — нижче через @import (зручно для одного файлу).
   Для продакшну краще винести у <head> з preconnect:
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
   Кирилицю Google Fonts віддає автоматично (обидві родини її мають).
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

/* ── База ───────────────────────────────────────────────── */
body {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  font-weight: var(--fw-regular);
  line-height: var(--lh-body);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ── Заголовки — serif, елегантні («книжкові») ──────────── */
.display, h1, .h1, h2, .h2 {
  font-family: var(--font-serif);
  color: var(--ink);
  margin: 0;
}
.display {
  font-size: var(--fs-display);
  font-weight: var(--fw-bold);
  line-height: var(--lh-display);
  letter-spacing: var(--tracking-display);
}
h1, .h1 {
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: 1.1;
  letter-spacing: var(--tracking-display);
}
h2, .h2 {
  font-size: var(--fs-h2);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-heading);
}

/* ── Підзаголовки / секції — sans, чисті ────────────────── */
h3, .h3 {
  font-family: var(--font-sans);
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  color: var(--ink);
  margin: 0;
}
.section-title {                 /* заголовок нумерованої картки: «Основна інформація» */
  font-family: var(--font-sans);
  font-size: var(--fs-title);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-snug);
  color: var(--ink);
}

/* ── Лід під заголовком («Реєструйся, щоб…») ────────────── */
.lead {
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--muted);
}

/* ── Дрібний / допоміжний текст ─────────────────────────── */
.text-sm, small {
  font-size: var(--fs-sm);
  line-height: 1.45;
}
.hint {                          /* «0/500», «Натисніть Enter, щоб додати тег» */
  font-size: var(--fs-xs);
  line-height: 1.4;
  color: var(--muted);
}

/* ── Лейбли полів ───────────────────────────────────────── */
.label {
  font-family: var(--font-sans);
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  line-height: 1.3;
  color: var(--text);
}
.label--required::after {        /* зірочка обов'язкового поля */
  content: " *";
  color: var(--danger);
}

/* ── Кнопки ─────────────────────────────────────────────── */
button, .btn {
  font-family: var(--font-sans);
  font-size: var(--fs-button);
  font-weight: var(--fw-semibold);
  line-height: 1;
}

/* ── Навігація / сайдбар ────────────────────────────────── */
.nav-link {
  font-family: var(--font-sans);
  font-size: var(--fs-nav);
  font-weight: var(--fw-medium);
}

/* ── Логотип ────────────────────────────────────────────── */
.logo {
  font-family: var(--font-serif);
  font-weight: var(--fw-bold);
  color: var(--ink);
}

/* ── Посилання — теракота ───────────────────────────────── */
/* Для дрібних inline-лінків лишай підкреслення (контраст теракоти ~3.9:1 у світлій темі). */
a {
  color: var(--primary);
  text-underline-offset: 2px;
}
a:hover { color: var(--primary-hover); }
</style><style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);transition:background .3s,color .3s}
a{color:var(--primary)}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.auth-form{position:relative;display:flex;flex-direction:column;min-height:100vh;overflow-y:auto;padding:28px 40px 40px}
.auth-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}.brand .bm{width:36px;height:36px}.brand .bw{height:20px;width:auto}
.theme-fab{width:42px;height:42px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center}.theme-fab svg{width:19px;height:19px}.theme-fab:hover{background:var(--surface-alt)}
.form-wrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:18px 0}
.form-inner{width:100%;max-width:432px}
.form-inner h1{font-family:var(--font-serif);color:var(--ink);font-size:clamp(1.8rem,3vw,2.3rem);margin:0;letter-spacing:var(--tracking-display)}
.form-inner .lead{color:var(--muted);font-size:.96rem;margin:8px 0 22px;line-height:1.5}
.field{margin-bottom:15px}
.label{display:flex;align-items:center;gap:6px;font-size:.86rem;font-weight:600;color:var(--text);margin-bottom:7px}
.label--required::after{content:"*";color:var(--danger);font-weight:700}
.opt{font-weight:500;color:var(--muted);font-size:.78rem}
.control{position:relative;display:flex;align-items:center}
.control .ci{position:absolute;left:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.control input{width:100%;height:48px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);padding:0 14px 0 42px;font:inherit;font-size:.94rem;color:var(--text);transition:border-color .15s,box-shadow .15s}
.control input::placeholder{color:var(--muted)}
.control input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--focus-ring)}
.control input[type=date]{padding-right:12px}
.pwtoggle{position:absolute;right:8px;width:34px;height:34px;border:0;background:none;border-radius:var(--radius-xs);color:var(--muted);cursor:pointer;display:grid;place-items:center}.pwtoggle:hover{color:var(--text);background:var(--surface-alt)}.pwtoggle svg{width:18px;height:18px}
.field.invalid .control input{border-color:var(--danger)}
.field.invalid .control input:focus{box-shadow:0 0 0 4px var(--danger-bg)}
.field.invalid .control .ci{color:var(--danger)}
.err{display:none;color:var(--danger);font-size:.8rem;margin:7px 0 0;align-items:center;gap:6px}
.field.invalid .err{display:flex}
.err::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--danger);flex:0 0 auto}
.err-terms{display:none;color:var(--danger);font-size:.8rem;margin:-4px 0 12px}.err-terms.show{display:block}
.hint{color:var(--muted);font-size:.78rem;margin:7px 0 0;line-height:1.4}
.strength{display:flex;gap:6px;margin-top:10px}
.strength .bar{flex:1 1 auto;height:5px;border-radius:99px;background:var(--surface-alt);transition:background .2s}
.strength .bar.on{background:var(--warning)}
.strength.s2 .bar.on{background:var(--warning)}.strength.s3 .bar.on{background:var(--primary)}.strength.full .bar.on{background:var(--success)}
.strength-label{display:block;font-size:.76rem;font-weight:600;margin-top:6px;color:var(--muted)}
.checklist{list-style:none;margin:11px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.checklist li{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted)}
.checklist li svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
.checklist li.ok{color:var(--success)}.checklist li.ok svg{color:var(--success)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-full);padding:8px 14px;font:600 .82rem/1 var(--font-sans);color:var(--text-secondary);cursor:pointer;transition:.12s}
.chip:hover{background:var(--accent-soft);color:var(--accent-soft-fg)}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:transparent}
.chip:disabled{opacity:.45;cursor:not-allowed}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:.86rem;color:var(--text);margin:6px 0 4px;user-select:none}
.check.sm{font-size:.84rem;margin:0}
.check input{position:absolute;opacity:0;width:0;height:0}
.check .cbox{width:20px;height:20px;border:1.5px solid var(--border);border-radius:6px;flex:0 0 auto;display:grid;place-items:center;background:var(--surface);transition:.15s;margin-top:1px}
.check .cbox svg{width:13px;height:13px;color:var(--on-primary);opacity:0;transition:opacity .15s}
.check input:checked+.cbox{background:var(--primary);border-color:var(--primary)}.check input:checked+.cbox svg{opacity:1}
.check input:focus-visible+.cbox{box-shadow:0 0 0 4px var(--focus-ring)}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.link{color:var(--primary);font-size:.84rem;font-weight:600;text-decoration:none}.link:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border:0;border-radius:var(--radius-sm);background:var(--primary);color:var(--on-primary);font-weight:600;font-size:.96rem;cursor:pointer;box-shadow:var(--shadow-btn)}
.btn:hover{background:var(--primary-hover)}.btn svg{width:18px;height:18px}.btn.full{width:100%}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);box-shadow:none}.btn.ghost:hover{background:var(--surface-alt)}.btn.mt{margin-top:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.loading{opacity:.8;cursor:wait}
.divider{display:flex;align-items:center;gap:14px;margin:20px 0;color:var(--muted);font-size:.8rem}
.divider::before,.divider::after{content:"";flex:1 1 auto;height:1px;background:var(--border)}
.social{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);color:var(--text);font-weight:600;font-size:.88rem;cursor:pointer}.sbtn:hover{background:var(--surface-alt)}.sbtn svg{width:18px;height:18px}
.auth-foot{text-align:center;color:var(--muted);font-size:.88rem;margin-top:22px}.auth-foot a{color:var(--primary);font-weight:600;text-decoration:none}.auth-foot a:hover{text-decoration:underline}.muted-foot{font-size:.8rem;line-height:1.5}
.alert{display:none;align-items:flex-start;gap:11px;background:var(--success-bg);border:1px solid color-mix(in srgb,var(--success) 30%,transparent);border-radius:var(--radius);padding:13px 15px;margin-bottom:18px}
.alert.show{display:flex}
.alert svg{width:20px;height:20px;color:var(--success);flex:0 0 auto;margin-top:1px}
.alert b{display:block;color:var(--ink);font-size:.9rem}.alert span{color:var(--text-secondary);font-size:.82rem}
.alert--error{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}.alert--error svg{color:var(--danger)}
/* reset stepper */
.reset .stepper{display:flex;align-items:center;gap:8px;margin-bottom:26px}
.step{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;color:var(--muted);font:600 .82rem/1 var(--font-sans);padding:0}
.step i{width:28px;height:28px;border-radius:var(--radius-full);background:var(--surface-alt);border:1px solid var(--border);display:grid;place-items:center;font-style:normal;font-size:.8rem;color:var(--muted)}
.step.on{color:var(--ink)}.step.on i{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.step.done i{background:var(--success-bg);border-color:transparent;color:var(--success)}
.step-line{flex:1 1 auto;height:1px;background:var(--border)}
.step-panel{display:none}.step-panel.on{display:block}
.big-ic{width:64px;height:64px;border-radius:var(--radius-full);background:var(--accent-soft);color:var(--primary);display:grid;place-items:center;margin-bottom:18px}.big-ic svg{width:28px;height:28px}
/* cover */
.auth-cover{position:relative;background-size:cover;background-position:center;overflow:hidden}
.cover-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,26,16,0) 35%,rgba(40,26,16,.62) 100%)}
.cover-text{position:absolute;left:0;right:0;bottom:0;padding:44px}
.cover-logo{display:flex;align-items:center;gap:11px;color:#fff;font-family:var(--font-serif);font-size:1.5rem;font-weight:700}.cover-logo svg{width:40px;height:40px}
.cover-tag{color:rgba(255,255,255,.92);font-family:var(--font-serif);font-style:italic;font-size:1.45rem;margin:16px 0 0;max-width:18ch;line-height:1.35}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-cover{display:none}.auth-form{padding:24px 22px 36px}.checklist{grid-template-columns:1fr}}
@media (max-width:560px){.auth-form{padding:20px 16px 32px}.social{grid-template-columns:1fr}.form-inner h1{font-size:1.65rem}}
@media (prefers-reduced-motion:reduce){body,.control input,.strength .bar,.chip{transition:none}}

<script>
var root=document.documentElement,tBtn=document.getElementById('themeToggle'),tIcon=document.getElementById('ticon');
function tic(){tIcon.innerHTML=root.dataset.theme==='dark'?'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';}
tic();tBtn.addEventListener('click',function(){root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',root.dataset.theme);tic();});

var LIMITS={NAME_MIN:2,NAME_MAX:50,EMAIL_MAX:254,PW_MIN:8,PW_MAX:64,NICK_MIN:3,NICK_MAX:20,MIN_AGE:13,MAX_AGE:120};
var RE={name:/^[A-Za-zА-Яа-яЁёІіЇїЄєҐґ' ’\-]{2,50}$/,email:/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/,nick:/^(?!.*[._]{2})[A-Za-z0-9][A-Za-z0-9._]{1,18}[A-Za-z0-9]$/,upper:/[A-ZА-ЯЁІЇЄҐ]/,lower:/[a-zа-яёіїєґ]/,digit:/\d/,special:/[^A-Za-zА-Яа-яЁёІіЇїЄєҐґ0-9]/,hasLetter:/[A-Za-zА-Яа-яЁёІіЇїЄєҐґ]/};
var COMMON_PW=['12345678','password','qwerty123','11111111','booknest','12345678','qwerty12'];
var M={nameEmpty:"Введіть ваше ім'я",nameShort:"Ім'я має містити щонайменше 2 символи",nameLong:"Ім'я задовге (максимум 50 символів)",nameChars:"Ім'я може містити лише літери, апостроф та дефіс",emailEmpty:"Введіть ваш e-mail",emailFormat:"Невірний формат e-mail",emailLong:"E-mail задовгий",pwEmpty:"Введіть пароль",pwPolicy:"Пароль не відповідає вимогам безпеки",pwSame:"Пароль не має збігатися з e-mail або ім'ям",pw2Empty:"Повторіть пароль",pw2Mismatch:"Паролі не збігаються",nickFormat:"Нікнейм: 3–20 символів, латиниця, цифри, _ або .",bdayFuture:"Дата народження не може бути в майбутньому",bdayAge:"Реєстрація доступна з 13 років",terms:"Підтвердьте згоду з умовами"};

function $(id){return document.getElementById(id);}
function norm(v){return v.trim().replace(/\s+/g,' ');}
function setErr(fid,msg){var f=$('f'+fid);if(!f)return;f.classList.add('invalid');var inp=f.querySelector('input');if(inp){inp.setAttribute('aria-invalid','true');}var e=$('e'+fid);if(e)e.textContent=msg;}
function clearErr(fid){var f=$('f'+fid);if(!f)return;f.classList.remove('invalid');var inp=f.querySelector('input');if(inp){inp.setAttribute('aria-invalid','false');}var e=$('e'+fid);if(e)e.textContent='';}
var touched={};

function vName(){var v=norm($('name').value);$('name').value=v;if(!v){setErr('Name',M.nameEmpty);return false;}if(v.length<LIMITS.NAME_MIN){setErr('Name',M.nameShort);return false;}if(v.length>LIMITS.NAME_MAX){setErr('Name',M.nameLong);return false;}if(!RE.name.test(v)||!RE.hasLetter.test(v)){setErr('Name',M.nameChars);return false;}clearErr('Name');return true;}
function vEmail(id){id=id||'Email';var el=$(id.toLowerCase());var v=el.value.trim().toLowerCase();el.value=v;if(!v){setErr(id,M.emailEmpty);return false;}if(v.length>LIMITS.EMAIL_MAX){setErr(id,M.emailLong);return false;}if(!RE.email.test(v)||v.indexOf('..')>=0){setErr(id,M.emailFormat);return false;}var loc=v.split('@')[0];if(loc[0]==='.'||loc[loc.length-1]==='.'){setErr(id,M.emailFormat);return false;}clearErr(id);return true;}
function pwScore(v){var s=0;if(v.length>=LIMITS.PW_MIN)s++;if(RE.upper.test(v)&&RE.lower.test(v))s++;if(RE.digit.test(v))s++;if(RE.special.test(v))s++;if(v.length>=12&&s>=3)s=Math.min(4,s+1);return s;}
function pwChecks(v){return{len:v.length>=LIMITS.PW_MIN,case:RE.upper.test(v)&&RE.lower.test(v),digit:RE.digit.test(v),special:RE.special.test(v)};}
function updatePwUI(pwId){var v=$(pwId).value;var f=$('f'+cap(pwId));var ch=pwChecks(v);if(f){f.querySelectorAll('.checklist li').forEach(function(li){li.classList.toggle('ok',!!ch[li.dataset.k]);});}var st=f?f.querySelector('.strength'):null;var lab=f?f.querySelector('.strength-label'):null;if(st){var n=0;Object.keys(ch).forEach(function(k){if(ch[k])n++;});var score=pwScore(v);var bars=st.querySelectorAll('.bar');bars.forEach(function(b,i){b.classList.toggle('on',i<score);});st.classList.remove('s2','s3','full');if(score>=4)st.classList.add('full');else if(score===3)st.classList.add('s3');else if(score===2)st.classList.add('s2');if(lab)lab.textContent=v?(score<=1?'Слабкий пароль':score<=3?'Середній пароль':'Надійний пароль'):'';}}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function pwPolicyOk(v){var c=pwChecks(v);var classes=(c.case?2:0)+(c.digit?1:0)+(c.special?1:0)+(c.len?0:-99);return c.len&&v.length<=LIMITS.PW_MAX&&c.case&&c.digit&&c.special&&COMMON_PW.indexOf(v.toLowerCase())<0;}
function vPw(pwId,errId){var v=$(pwId).value;if(!v){setErr(errId,M.pwEmpty);return false;}if(!pwPolicyOk(v)){setErr(errId,M.pwPolicy);return false;}clearErr(errId);return true;}
function vPw2(pwId,pw2Id,errId){var a=$(pwId).value,b=$(pw2Id).value;if(!b){setErr(errId,M.pw2Empty);return false;}if(a!==b){setErr(errId,M.pw2Mismatch);return false;}clearErr(errId);return true;}
function vNick(){var el=$('nick');if(!el)return true;var v=el.value.trim();if(!v){clearErr('Nick');return true;}if(!RE.nick.test(v)){setErr('Nick',M.nickFormat);return false;}clearErr('Nick');return true;}
function vBday(){var el=$('bday');if(!el||!el.value){clearErr('Bday');return true;}var d=new Date(el.value);var now=new Date();if(d>now){setErr('Bday',M.bdayFuture);return false;}var age=now.getFullYear()-d.getFullYear();var m=now.getMonth()-d.getMonth();if(m<0||(m===0&&now.getDate()<d.getDate()))age--;if(age<LIMITS.MIN_AGE){setErr('Bday',M.bdayAge);return false;}clearErr('Bday');return true;}

function wireField(fid,validator){var f=$('f'+fid);if(!f)return;var inp=f.querySelector('input');if(!inp)return;inp.addEventListener('blur',function(){if(inp.value||touched[fid]){touched[fid]=true;validator();}});inp.addEventListener('input',function(){if(f.classList.contains('invalid'))validator();});}
function pwToggleInit(){document.querySelectorAll('.pwtoggle').forEach(function(b){b.addEventListener('click',function(){var inp=b.parentNode.querySelector('input');var show=inp.type==='password';inp.type=show?'text':'password';b.querySelector('use').setAttribute('href',show?'#i-eye-off':'#i-eye');b.setAttribute('aria-label',show?'Приховати пароль':'Показати пароль');});});}
function focusFirstInvalid(){var f=document.querySelector('.field.invalid');if(f){var inp=f.querySelector('input');if(inp)inp.focus();f.scrollIntoView({behavior:'smooth',block:'center'});}}
function loadBtn(btn,txt){btn.dataset.t=btn.textContent;btn.textContent=txt||'Зачекайте…';btn.classList.add('loading');btn.disabled=true;}
function restoreBtn(btn){btn.textContent=btn.dataset.t;btn.classList.remove('loading');btn.disabled=false;}

pwToggleInit();
var PAGE=document.body.dataset.page;

if(PAGE==='register'){
  wireField('Name',vName);wireField('Email',function(){return vEmail('Email');});
  wireField('Pw',function(){return vPw('pw','Pw');});wireField('Pw2',function(){return vPw2('pw','pw2','Pw2');});
  wireField('Nick',vNick);wireField('Bday',vBday);
  $('pw').addEventListener('input',function(){updatePwUI('pw');if($('fPw2').classList.contains('invalid'))vPw2('pw','pw2','Pw2');});
  var terms=$('terms'),sb=$('submitBtn');
  terms.addEventListener('change',function(){sb.disabled=!terms.checked;if(terms.checked)$('eTerms').classList.remove('show');});
  $('regForm').addEventListener('submit',function(e){e.preventDefault();touched={Name:1,Email:1,Pw:1,Pw2:1,Nick:1,Bday:1};
    var ok=[vName(),vEmail('Email'),vPw('pw','Pw'),vPw2('pw','pw2','Pw2'),vNick(),vBday()].every(Boolean);
    if(!terms.checked){$('eTerms').textContent=M.terms;$('eTerms').classList.add('show');ok=false;}
    if(!ok){focusFirstInvalid();return;}
    loadBtn(sb);setTimeout(function(){restoreBtn(sb);$('okBanner').classList.add('show');$('okBanner').scrollIntoView({behavior:'smooth',block:'center'});},700);});
}
if(PAGE==='login'){
  wireField('Email',function(){return vEmail('Email');});
  wireField('Pw',function(){var v=$('pw').value;if(!v){setErr('Pw',M.pwEmpty);return false;}clearErr('Pw');return true;});
  $('forgotLink').addEventListener('click',function(e){e.preventDefault();});
  $('loginForm').addEventListener('submit',function(e){e.preventDefault();touched={Email:1,Pw:1};
    var okE=vEmail('Email');var pv=$('pw').value;var okP=true;if(!pv){setErr('Pw',M.pwEmpty);okP=false;}else clearErr('Pw');
    $('errBanner').classList.remove('show');$('okBanner').classList.remove('show');
    if(!(okE&&okP)){focusFirstInvalid();return;}
    var sb=$('submitBtn');loadBtn(sb,'Входимо…');setTimeout(function(){restoreBtn(sb);$('okBanner').classList.add('show');$('okBanner').scrollIntoView({behavior:'smooth',block:'center'});},700);});
}
if(PAGE==='reset'){
  var steps=document.querySelectorAll('.stepper .step'),panels=document.querySelectorAll('.step-panel');
  function go(n){steps.forEach(function(s){var sn=+s.dataset.step;s.classList.toggle('on',sn===n);s.classList.toggle('done',sn<n);});panels.forEach(function(p){p.classList.toggle('on',+p.dataset.panel===n);});}
  steps.forEach(function(s){s.addEventListener('click',function(){go(+s.dataset.step);});});
  wireField('Email',function(){return vEmail('Email');});
